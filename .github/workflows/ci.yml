# The checks every pull request and every push to main must pass: the same parts as
# `npm run verify` (scripts/verify.mjs), run on a Linux machine. The install test runs only when
# the workflow is started by hand or by `npm run ship`, which releases only a commit whose run
# passed every job. No secrets: it reads the repository and nothing else.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A run started by ship gets its own group: a push to main would cancel it while it waits.
concurrency:
  group: ci-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # prisma generate needs an address (prisma.config.ts): the dev Postgres (dev/compose.dev.yml).
  DATABASE_URL: postgresql://ilex:ilex-dev@127.0.0.1:5432/ilex

jobs:
  checks:
    name: Lint, format and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # As the dev container (dev/server/Dockerfile).
          node-version: 26
      - run: npm ci
      - name: Lint (the workspaces and the programs' type check)
        run: npm run verify -- --only lint
      - name: Format
        run: npm run verify -- --only format
      - name: Borg (the backup program's tests against the real Borg, skipped without it)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends borgbackup
      - name: Unit tests (shared, i18n, the server with the programs and the helper, web)
        run: npm run verify -- --only unit

  e2e:
    name: Integration and e2e tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - run: npm ci
      - name: Borg (the backup tests) and the current Docker Engine
        # The runner image's Docker is older than the API versions the proxy test asks for, and
        # the image removes Docker's repository after installing it: added again, as the
        # installer adds it.
        run: |
          docker version --format 'Docker before: {{.Server.Version}} (API {{.Server.APIVersion}})'
          sudo install -d -m 0755 /etc/apt/keyrings
          curl -fsSL --proto '=https' https://download.docker.com/linux/ubuntu/gpg |
            sudo gpg --dearmor --yes -o /etc/apt/keyrings/docker.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo "$VERSION_CODENAME") stable" |
            sudo tee /etc/apt/sources.list.d/docker.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends borgbackup docker-ce docker-ce-cli containerd.io
          docker version --format 'Docker now: {{.Server.Version}} (API {{.Server.APIVersion}})'
      - name: Dev services (Postgres, the Docker proxy, sshd, the sandbox)
        # The keys folder made first: Docker would make it, and .dev/ above it, as root.
        run: |
          mkdir -p apps/server/.dev/sshd
          dev/compose.sh up -d --wait
          timeout 60 bash -c 'until [ -f apps/server/.dev/sshd/ssh_host_ed25519_key.pub ]; do sleep 1; done'
      - name: Integration and e2e tests (a skipped test fails)
        run: npm run verify -- --only e2e

  install:
    name: Install test (Debian 13 container)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    # A second machine updates the oldest supported release straight to this one (--from).
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The tags: the oldest release's own smoke test comes from its tag.
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: Disk space for the test machine's Docker (toolchains this job doesn't use removed)
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - run: npm ci
      - name: Install test (tools/vm/test-install.sh --container)
        # The disk's use logged meanwhile: the test machine's volumes are gone after a failure.
        run: |
          mkdir -p tools/vm/run
          (while sleep 20; do echo "$(date -u +%T) $(df -h / | tail -n 1)"; done) >tools/vm/run/df.log 2>&1 &
          npm run verify -- --only install
      - name: Disk use during the install test
        if: always()
        run: cat tools/vm/run/df.log || true
      - name: Install test logs
        if: failure()
        run: tail -n 200 tools/vm/run/release.log tools/vm/run/container.log || true
