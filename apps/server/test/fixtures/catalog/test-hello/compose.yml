# For the e2e tests only (test/services.e2e-spec.ts): busybox serving a folder on a port.
services:
  web:
    image: busybox:1.37@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
    command: ['httpd', '-f', '-p', '8080', '-h', '/www']
    environment:
      TOKEN: ${TOKEN}
    ports:
      - '${WEB_PORT}:8080'
    volumes:
      - type: bind
        source: ${SITE_DIR}
        target: /www
        read_only: true
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: 1m }
