<button
  hlmBtn
  variant="ghost"
  size="icon"
  [hlmDropdownMenuTrigger]="menu"
  align="end"
  [attr.aria-label]="label()"
>
  <ng-icon [name]="theme.dark() ? 'lucideMoon' : 'lucideSun'" aria-hidden="true" />
</button>
<ng-template #menu>
  <hlm-dropdown-menu class="w-40">
    <div hlmDropdownMenuLabel>{{ 'theme.title' | translate }}</div>
    <div hlmDropdownMenuGroup>
      @for (option of options; track option.value) {
        <button
          hlmDropdownMenuRadio
          [checked]="theme.choice() === option.value"
          [keepOpen]="false"
          (triggered)="theme.setChoice(option.value)"
        >
          <hlm-dropdown-menu-radio-indicator />
          {{ option.label | translate }}
        </button>
      }
    </div>
  </hlm-dropdown-menu>
</ng-template>
