<span
  aria-hidden="true"
  class="size-2 rounded-full"
  [class]="
    status() === 'live'
      ? 'bg-success motion-safe:animate-heartbeat motion-reduce:animate-heartbeat-fade'
      : status() === 'offline'
        ? 'bg-muted-foreground'
        : 'animate-pulse bg-warning'
  "
></span>
<span
  class="max-sm:sr-only"
  [hlmTooltip]="kernel()"
  [tooltipDisabled]="!kernel()"
  position="bottom"
>
  {{ label() }}
</span>
