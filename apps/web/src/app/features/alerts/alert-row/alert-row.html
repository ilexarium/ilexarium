<div
  class="flex flex-wrap items-center gap-x-3 gap-y-1 px-4 py-3 text-sm"
  [attr.aria-labelledby]="'alert-' + alert().id"
>
  <ilex-status-dot tone="ok" class="min-w-0 flex-1 basis-60 text-foreground">
    <span [id]="'alert-' + alert().id" class="min-w-0 break-words">{{
      title()[0] | translate: title()[1]
    }}</span>
  </ilex-status-dot>
  <span class="text-muted-foreground">
    {{
      'alerts.lasted'
        | translate
          : {
              duration: lasted(),
              time: formatter.dateTime(alert().closedAt!),
            }
    }}
  </span>
</div>
