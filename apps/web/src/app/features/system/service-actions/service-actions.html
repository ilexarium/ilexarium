<button
  hlmBtn
  variant="ghost"
  size="icon"
  [hlmDropdownMenuTrigger]="menu"
  align="end"
  [attr.aria-label]="'systemServices.actionsFor' | translate: { name: name() }"
>
  <ng-icon name="lucideEllipsis" aria-hidden="true" />
</button>
<ng-template #menu>
  <hlm-dropdown-menu class="w-44">
    <button hlmDropdownMenuItem (triggered)="details.emit()">
      <ng-icon name="lucideInfo" aria-hidden="true" />
      {{ 'systemServices.details' | translate }}
    </button>
    @for (action of actions(); track action) {
      <button hlmDropdownMenuItem (triggered)="choose(action)">
        <ng-icon [name]="icons[action]" aria-hidden="true" />
        {{ 'systemServices.action.' + action | translate }}
      </button>
    }
  </hlm-dropdown-menu>
</ng-template>

<hlm-alert-dialog>
  <hlm-alert-dialog-content *hlmAlertDialogPortal>
    <hlm-alert-dialog-header>
      <h2 hlmAlertDialogTitle>
        {{ title()[0] }}<span dir="ltr">{{ name() }}</span
        >{{ title()[1] }}
      </h2>
      <p hlmAlertDialogDescription>
        {{ 'systemServices.confirm.' + confirming() + '.text' | translate }}
      </p>
      @if (protection() === 'essential') {
        <p class="text-sm text-warning" data-essential-warning>
          {{ 'systemServices.confirm.essential' | translate }}
        </p>
      }
    </hlm-alert-dialog-header>
    <hlm-alert-dialog-footer>
      <button hlmAlertDialogCancel>{{ 'systemServices.confirm.cancel' | translate }}</button>
      <button
        hlmAlertDialogAction
        [variant]="confirming() === 'stop' ? 'destructive' : 'default'"
        (click)="confirm()"
      >
        {{ 'systemServices.action.' + confirming() | translate }}
      </button>
    </hlm-alert-dialog-footer>
  </hlm-alert-dialog-content>
</hlm-alert-dialog>
