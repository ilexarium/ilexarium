<section hlmCard class="max-w-md" aria-labelledby="linux-sign-in-title">
  <div hlmCardHeader>
    <h2 hlmCardTitle id="linux-sign-in-title">{{ title() | translate }}</h2>
    <p hlmCardDescription>{{ text() | translate }}</p>
  </div>
  <div hlmCardContent>
    <form [formRoot]="form" class="grid gap-5">
      <laris-form-errors [form]="form" />
      <div hlmField>
        <label hlmFieldLabel for="linux-username">{{ 'files.signIn.username' | translate }}</label>
        <input
          hlmInput
          id="linux-username"
          dir="ltr"
          autocomplete="username"
          autocapitalize="none"
          spellcheck="false"
          [formField]="form.username"
        />
        <laris-field-errors [field]="form.username" />
      </div>
      <div hlmField>
        <label hlmFieldLabel for="linux-password">{{ 'files.signIn.password' | translate }}</label>
        <div class="relative">
          <input
            hlmInput
            id="linux-password"
            dir="ltr"
            class="pe-10"
            autocomplete="current-password"
            [type]="showPassword() ? 'text' : 'password'"
            [formField]="form.password"
          />
          <laris-password-toggle [(visible)]="showPassword" />
        </div>
        <laris-field-errors [field]="form.password" />
      </div>
      <button hlmBtn type="submit" class="justify-self-start" [disabled]="form().submitting()">
        {{ (form().submitting() ? 'files.signIn.submitting' : 'files.signIn.submit') | translate }}
      </button>
    </form>
  </div>
</section>
