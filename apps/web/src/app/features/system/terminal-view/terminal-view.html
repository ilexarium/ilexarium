<!-- The terminal is placed inside its box, so its width never widens the page; the box sets the size. -->
<div
  class="relative min-h-0 flex-1 overflow-hidden rounded-lg border"
  [style.background-color]="palette().background"
>
  <div
    #box
    class="terminal-box absolute inset-2"
    dir="ltr"
    role="region"
    [attr.aria-label]="'terminal.region' | translate"
  ></div>
</div>
<div
  class="flex flex-wrap gap-1 md:hidden"
  dir="ltr"
  role="toolbar"
  [attr.aria-label]="'terminal.keys.label' | translate"
>
  <button hlmBtn variant="outline" size="sm" class="min-w-11" (click)="key(keys.esc)">
    {{ 'terminal.keys.esc' | translate }}
  </button>
  <button hlmBtn variant="outline" size="sm" class="min-w-11" (click)="key(keys.tab)">
    {{ 'terminal.keys.tab' | translate }}
  </button>
  <button
    hlmBtn
    size="sm"
    class="min-w-11"
    [variant]="ctrl() ? 'default' : 'outline'"
    [attr.aria-pressed]="ctrl()"
    (click)="toggleCtrl()"
  >
    {{ 'terminal.keys.ctrl' | translate }}
  </button>
  @for (arrow of ['left', 'up', 'down', 'right']; track arrow) {
    <button
      hlmBtn
      variant="outline"
      size="sm"
      class="min-w-11"
      [attr.aria-label]="'terminal.keys.' + arrow | translate"
      (click)="key($any(keys)[arrow])"
    >
      <ng-icon
        [name]="'lucideArrow' + arrow[0].toUpperCase() + arrow.slice(1)"
        aria-hidden="true"
      />
    </button>
  }
</div>
