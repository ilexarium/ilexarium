<section hlmCard class="h-full" aria-labelledby="memory-title">
  <div hlmCardHeader>
    <h2 hlmCardTitle id="memory-title">{{ 'dashboard.memory.title' | translate }}</h2>
    <p hlmCardDescription>{{ 'dashboard.memory.total' | translate: { size: total() } }}</p>
  </div>
  <div hlmCardContent class="grid gap-3">
    <p class="text-3xl font-semibold tabular-nums">{{ usedPercent() }}</p>
    <hlm-progress [value]="usedValue()" [attr.aria-label]="'dashboard.memory.inUse' | translate">
      <hlm-progress-indicator />
    </hlm-progress>
    <p class="text-sm text-muted-foreground">
      {{ 'dashboard.memory.used' | translate: { size: used() } }}
    </p>
    <p class="text-sm text-muted-foreground">{{ swap() }}</p>
    <app-metric-chart
      [series]="chart()"
      unit="bytes"
      [max]="memory().totalBytes"
      [label]="'dashboard.memory.inUse' | translate"
    />
  </div>
</section>
