<section hlmCard class="h-full" aria-labelledby="cpu-title">
  <div hlmCardHeader>
    <h2 hlmCardTitle id="cpu-title">{{ 'dashboard.cpu.title' | translate }}</h2>
    <p hlmCardDescription>{{ 'dashboard.cpu.cores' | plural: cores() }}</p>
  </div>
  <div hlmCardContent class="grid gap-3">
    <p class="text-3xl font-semibold tabular-nums">{{ usage() }}</p>
    <hlm-progress
      [value]="cpu().usagePercent"
      [attr.aria-label]="'dashboard.cpu.usage' | translate"
    >
      <hlm-progress-indicator />
    </hlm-progress>
    <p class="text-sm text-muted-foreground">
      {{ 'dashboard.cpu.load' | translate: { values: load() } }}
      <span class="whitespace-nowrap">{{ 'dashboard.cpu.loadPeriods' | translate }}</span>
    </p>
    <app-metric-chart
      [series]="chart()"
      unit="percent"
      [max]="100"
      [label]="'dashboard.cpu.usage' | translate"
    />
  </div>
</section>
