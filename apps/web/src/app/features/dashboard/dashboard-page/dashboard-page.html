@if (store.system(); as system) {
  <div class="grid grid-cols-1 gap-4 md:gap-6">
    @if (store.alerts().length > 0) {
      <laris-alerts-notice [alerts]="store.alerts()" />
    }
    <laris-host-summary [host]="system.host" [uptimeSeconds]="system.uptimeSeconds" />
    <div class="grid gap-4 sm:grid-cols-2 xl:grid-cols-3">
      <laris-cpu-card
        [cpu]="system.sample.cpu"
        [cores]="system.host.cpuCores"
        [history]="system.history"
      />
      <laris-memory-card [memory]="system.sample.memory" [history]="system.history" />
      <laris-network-card
        [interfaces]="system.sample.network"
        [history]="system.history"
        class="sm:col-span-2 xl:col-span-1"
      />
    </div>
    <laris-disk-list [disks]="system.disks" />
    <laris-containers-table
      [containers]="store.containers()"
      [now]="system.sample.at"
      [pending]="store.pending()"
      (action)="store.act($event)"
    >
      <a emptyAction hlmBtn variant="outline" size="sm" routerLink="/services">{{
        'containers.noneAction' | translate
      }}</a>
    </laris-containers-table>
  </div>
} @else {
  <div
    class="grid gap-4 md:gap-6"
    role="status"
    [attr.aria-label]="'dashboard.loading' | translate"
  >
    <hlm-skeleton class="h-5 w-2/3" />
    <div class="grid gap-4 sm:grid-cols-2 xl:grid-cols-3">
      @for (card of [1, 2, 3]; track card) {
        <hlm-skeleton class="h-44 rounded-xl" />
      }
    </div>
    <hlm-skeleton class="h-48 rounded-xl" />
  </div>
}
