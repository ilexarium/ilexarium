<ilex-auth-frame
  [heading]="'auth.setup.heading' | translate: { app: appName }"
  [description]="'auth.setup.description' | translate"
>
  @if (!secure) {
    <ilex-insecure-context-notice />
  } @else {
    <form [formRoot]="form" class="grid gap-5">
      <ilex-form-errors [form]="form" />

      <div hlmField>
        <label hlmFieldLabel for="setupToken">{{ 'auth.setup.setupCode' | translate }}</label>
        <input
          hlmInput
          id="setupToken"
          dir="ltr"
          class="font-mono"
          [formField]="form.setupToken"
          autocomplete="off"
          autocapitalize="characters"
          spellcheck="false"
        />
        <p hlmFieldDescription>
          {{ setupCodeHelp()[0] }}<code dir="ltr">sudo ilex-setup-code</code
          >{{ setupCodeHelp()[1] }}
        </p>
        <ilex-field-errors [field]="form.setupToken" />
      </div>

      <div hlmField>
        <label hlmFieldLabel for="username">{{ 'auth.username' | translate }}</label>
        <input
          hlmInput
          id="username"
          dir="ltr"
          [formField]="form.username"
          autocomplete="username"
          autocapitalize="none"
          spellcheck="false"
        />
        <p hlmFieldDescription>{{ 'auth.setup.usernameHelp' | translate }}</p>
        <ilex-field-errors [field]="form.username" />
      </div>

      <div hlmField>
        <label hlmFieldLabel for="password">{{ 'auth.password' | translate }}</label>
        <div class="relative">
          <input
            hlmInput
            id="password"
            dir="ltr"
            class="pe-10"
            [type]="showPasswords() ? 'text' : 'password'"
            [formField]="form.password"
            autocomplete="new-password"
          />
          <ilex-password-toggle [(visible)]="showPasswords" />
        </div>
        <p hlmFieldDescription>{{ 'auth.setup.passwordHelp' | translate: limits }}</p>
        <ilex-field-errors [field]="form.password" />
      </div>

      <div hlmField>
        <label hlmFieldLabel for="confirmPassword">{{
          'auth.setup.confirmPassword' | translate
        }}</label>
        <input
          hlmInput
          id="confirmPassword"
          dir="ltr"
          [type]="showPasswords() ? 'text' : 'password'"
          [formField]="form.confirmPassword"
          autocomplete="new-password"
        />
        <ilex-field-errors [field]="form.confirmPassword" />
      </div>

      <button hlmBtn type="submit" class="w-full" [disabled]="form().submitting()">
        {{ (form().submitting() ? 'auth.setup.submitting' : 'auth.setup.submit') | translate }}
      </button>
    </form>
    <aside class="mt-6 grid gap-2 border-t pt-4" aria-labelledby="setup-moving">
      <p id="setup-moving" class="text-sm font-medium">
        {{ 'auth.setup.movingTitle' | translate }}
      </p>
      <p class="text-sm text-muted-foreground">{{ 'auth.setup.movingText' | translate }}</p>
      <ilex-copy-command command="sudo ilex-recover" />
    </aside>
  }
</ilex-auth-frame>
