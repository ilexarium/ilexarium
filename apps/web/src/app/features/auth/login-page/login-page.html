<laris-auth-frame
  [heading]="'pages.login' | translate"
  [description]="'auth.login.description' | translate"
>
  @if (!secure) {
    <laris-insecure-context-notice />
  } @else {
    <form [formRoot]="form" class="grid gap-5">
      @if (expired) {
        <div hlmAlert>
          <p hlmAlertTitle>{{ 'auth.login.expiredTitle' | translate }}</p>
          <p hlmAlertDescription>{{ 'auth.login.expiredText' | translate }}</p>
        </div>
      }
      <laris-form-errors [form]="form" />

      <div hlmField>
        <label hlmFieldLabel for="username">{{ 'auth.username' | translate }}</label>
        <input
          hlmInput
          id="username"
          dir="ltr"
          [formField]="form.username"
          autocomplete="username"
          autocapitalize="none"
          spellcheck="false"
        />
        <laris-field-errors [field]="form.username" />
      </div>

      <div hlmField>
        <label hlmFieldLabel for="password">{{ 'auth.password' | translate }}</label>
        <div class="relative">
          <input
            hlmInput
            id="password"
            dir="ltr"
            class="pe-10"
            [type]="showPassword() ? 'text' : 'password'"
            [formField]="form.password"
            autocomplete="current-password"
          />
          <laris-password-toggle [(visible)]="showPassword" />
        </div>
        <laris-field-errors [field]="form.password" />
      </div>

      <button hlmBtn type="submit" class="w-full" [disabled]="form().submitting()">
        {{ (form().submitting() ? 'auth.login.submitting' : 'auth.login.submit') | translate }}
      </button>
    </form>
  }
</laris-auth-frame>
