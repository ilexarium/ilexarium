<!-- The logo: the mark and the name, always left to right (it's a picture of the name). -->
<div class="flex items-center gap-0.5 text-primary" dir="ltr">
  <!-- The mark as tall as the capitals (brand/README.md): 45 of its 64 units, Plex caps 0.7 em. -->
  <app-laris-mark class="size-[30px]" />
  <span class="text-3xl font-semibold tracking-tight text-foreground">{{ appName }}</span>
</div>
<main hlmCard class="w-full max-w-sm">
  <div hlmCardHeader>
    <h1 hlmCardTitle class="text-xl">{{ heading() }}</h1>
    <p hlmCardDescription>{{ description() }}</p>
  </div>
  <div hlmCardContent><ng-content /></div>
</main>
