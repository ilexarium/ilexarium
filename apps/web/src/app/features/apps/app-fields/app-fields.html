<ng-template #row let-field>
  <div class="grid gap-1.5">
    <label hlmLabel [for]="'field-' + field.key">
      {{ text(field, 'label') | translate }}
      @if (field.required) {
        <span class="text-muted-foreground">{{ 'apps.fields.required' | translate }}</span>
      }
    </label>
    <input
      hlmInput
      dir="ltr"
      autocomplete="off"
      spellcheck="false"
      [id]="'field-' + field.key"
      [type]="inputType(field)"
      [attr.inputmode]="field.kind === 'port' ? 'numeric' : null"
      [value]="value(field)"
      [disabled]="disabled()"
      (change)="edit(field, $event)"
    />
    <p class="text-sm text-muted-foreground">{{ text(field, 'help') | translate }}</p>
  </div>
</ng-template>

@for (field of main(); track field.key) {
  <ng-container *ngTemplateOutlet="row; context: { $implicit: field }" />
}
@if (advanced().length > 0) {
  <details class="rounded-md border p-3">
    <summary class="cursor-pointer text-sm font-medium select-none">
      {{ 'apps.fields.advanced' | translate }}
    </summary>
    <div class="mt-4 grid gap-5">
      @for (field of advanced(); track field.key) {
        <ng-container *ngTemplateOutlet="row; context: { $implicit: field }" />
      }
    </div>
  </details>
}
