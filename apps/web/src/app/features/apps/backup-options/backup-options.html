<label class="flex items-start gap-2 text-sm">
  <input
    type="checkbox"
    class="mt-0.5 size-4"
    [checked]="value().include"
    (change)="changed.emit({ include: $any($event.target).checked })"
  />
  {{ 'apps.backup.include' | translate }}
</label>
@if (value().include) {
  <div class="grid gap-1.5">
    <label hlmLabel for="backup-mode">{{ 'apps.backup.mode' | translate }}</label>
    <select
      id="backup-mode"
      class="h-9 rounded-md border bg-background px-2 text-sm"
      [value]="value().mode"
      (change)="changed.emit({ mode: $any($event.target).value })"
    >
      <option value="stop">{{ 'apps.backup.stop' | translate }}</option>
      <option value="live">{{ 'apps.backup.live' | translate }}</option>
    </select>
  </div>
  <div class="grid gap-1.5">
    <span class="text-sm font-medium">{{ 'apps.backup.skip' | translate }}</span>
    <ul class="grid gap-1">
      @for (skip of value().skip; track skip) {
        <li class="flex items-center gap-2 text-sm">
          <code dir="ltr" class="break-all">{{ skip }}</code>
          <button
            hlmBtn
            variant="ghost"
            size="icon"
            type="button"
            [attr.aria-label]="'apps.backup.removeSkip' | translate: { path: skip }"
            (click)="removeSkip(skip)"
          >
            <ng-icon name="lucideX" aria-hidden="true" />
          </button>
        </li>
      }
    </ul>
    <div class="flex flex-wrap gap-2">
      <input
        hlmInput
        class="min-w-0 flex-1"
        dir="ltr"
        [attr.aria-label]="'apps.backup.newSkip' | translate"
        [placeholder]="'apps.backup.newSkipPlaceholder' | translate"
        [value]="newSkip()"
        (input)="newSkip.set(text($event))"
      />
      <button hlmBtn variant="outline" type="button" (click)="addSkip()">
        {{ 'apps.backup.addSkip' | translate }}
      </button>
    </div>
  </div>
}
