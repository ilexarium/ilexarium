<hlm-alert-dialog>
  <hlm-alert-dialog-content *hlmAlertDialogPortal>
    <hlm-alert-dialog-header>
      <h2 hlmAlertDialogTitle>{{ 'backups.passphrase.againTitle' | translate }}</h2>
      <p hlmAlertDialogDescription>{{ 'backups.passphrase.againText' | translate }}</p>
    </hlm-alert-dialog-header>
    <form [formRoot]="form" class="grid gap-4">
      <laris-form-errors [form]="form" />
      <div hlmField>
        <label hlmFieldLabel for="confirm-password">{{
          'backups.passphrase.password' | translate
        }}</label>
        <div class="relative">
          <input
            hlmInput
            id="confirm-password"
            dir="ltr"
            class="pe-10"
            autocomplete="current-password"
            [type]="showPassword() ? 'text' : 'password'"
            [formField]="form.password"
          />
          <laris-password-toggle [(visible)]="showPassword" />
        </div>
        <laris-field-errors [field]="form.password" />
      </div>
      <hlm-alert-dialog-footer>
        <button hlmBtn type="button" variant="outline" (click)="close()">
          {{ 'backups.passphrase.cancel' | translate }}
        </button>
        <button hlmBtn type="submit" [disabled]="form().submitting()">
          {{ 'backups.passphrase.show' | translate }}
        </button>
      </hlm-alert-dialog-footer>
    </form>
  </hlm-alert-dialog-content>
</hlm-alert-dialog>
