<hlm-alert-dialog>
  <hlm-alert-dialog-content *hlmAlertDialogPortal>
    <hlm-alert-dialog-header>
      <h2 hlmAlertDialogTitle class="break-words">
        {{ 'disks.mountDialog.title' | translate: { name: title() } }}
      </h2>
      <p hlmAlertDialogDescription>{{ 'disks.mountDialog.text' | translate }}</p>
    </hlm-alert-dialog-header>
    <form [formRoot]="form" class="grid gap-4">
      <app-form-errors [form]="form" />
      <div hlmField>
        <label hlmFieldLabel for="disk-name">{{ 'disks.mountDialog.name' | translate }}</label>
        <input
          hlmInput
          id="disk-name"
          dir="ltr"
          autocomplete="off"
          spellcheck="false"
          [formField]="form.name"
        />
        <app-field-errors [field]="form.name" />
      </div>
      <p class="text-sm">
        {{ 'disks.mountDialog.path' | translate }}
        <code class="break-all" dir="ltr">{{ path() }}</code>
      </p>
      <p class="text-sm text-muted-foreground">{{ 'disks.mountDialog.kept' | translate }}</p>
      <hlm-alert-dialog-footer>
        <button hlmBtn type="button" variant="outline" (click)="close()">
          {{ 'disks.mountDialog.cancel' | translate }}
        </button>
        <button hlmBtn type="submit" [disabled]="form().submitting()">
          {{ 'disks.mountDialog.confirm' | translate }}
        </button>
      </hlm-alert-dialog-footer>
    </form>
  </hlm-alert-dialog-content>
</hlm-alert-dialog>
