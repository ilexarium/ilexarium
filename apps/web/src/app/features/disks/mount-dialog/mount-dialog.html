<hlm-alert-dialog>
  <hlm-alert-dialog-content *hlmAlertDialogPortal>
    <hlm-alert-dialog-header>
      <h2 hlmAlertDialogTitle class="break-words">
        {{ 'disks.mountDialog.title' | translate: { name: title() } }}
      </h2>
      <p hlmAlertDialogDescription>{{ 'disks.mountDialog.text' | translate }}</p>
    </hlm-alert-dialog-header>
    <form [formRoot]="form" class="grid gap-4">
      <laris-form-errors [form]="form" />
      <div hlmField>
        <label hlmFieldLabel for="mount-point">{{ 'disks.mountDialog.mountPoint' | translate }}</label>
        <input
          hlmInput
          id="mount-point"
          dir="ltr"
          autocomplete="off"
          spellcheck="false"
          [formField]="form.mountPoint"
        />
        <laris-field-errors [field]="form.mountPoint" />
        <p class="text-sm text-muted-foreground">{{ 'disks.mountDialog.mountPointHelp' | translate }}</p>
      </div>
      <label class="flex items-start gap-2 text-sm">
        <input type="checkbox" class="mt-0.5 size-4" [formField]="form.makeMine" />
        <span class="grid gap-0.5">
          <span>{{ 'disks.mountDialog.makeMine' | translate }}</span>
          <span class="text-muted-foreground">{{ 'disks.mountDialog.makeMineHelp' | translate }}</span>
        </span>
      </label>
      <p class="text-sm text-muted-foreground">{{ 'disks.mountDialog.kept' | translate }}</p>
      <hlm-alert-dialog-footer>
        <button hlmBtn type="button" variant="outline" (click)="close()">
          {{ 'disks.mountDialog.cancel' | translate }}
        </button>
        <button hlmBtn type="submit" [disabled]="form().submitting()">
          {{ 'disks.mountDialog.confirm' | translate }}
        </button>
      </hlm-alert-dialog-footer>
    </form>
  </hlm-alert-dialog-content>
</hlm-alert-dialog>
