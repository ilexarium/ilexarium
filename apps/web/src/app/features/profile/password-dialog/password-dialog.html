<hlm-dialog [state]="shown() ? 'open' : 'closed'" (closed)="closed.emit()">
  <hlm-dialog-content
    *hlmDialogPortal
    class="max-h-[90dvh] overflow-y-auto"
    [closeLabel]="'account.close' | translate"
  >
    <hlm-dialog-header>
      <h2 hlmDialogTitle>{{ 'account.title' | translate }}</h2>
      <p hlmDialogDescription>{{ 'account.description' | translate }}</p>
    </hlm-dialog-header>
    <form id="password-form" [formRoot]="form" class="grid gap-5">
      <ilex-form-errors [form]="form" />

      <!-- Lets password managers tie the new password to this account. -->
      <input
        type="text"
        autocomplete="username"
        [value]="authStore.user()?.username"
        hidden
        readonly
      />

      <div hlmField>
        <label hlmFieldLabel for="currentPassword">{{
          'account.currentPassword' | translate
        }}</label>
        <div class="relative">
          <input
            hlmInput
            id="currentPassword"
            dir="ltr"
            class="pe-10"
            [type]="showPasswords() ? 'text' : 'password'"
            [formField]="form.currentPassword"
            autocomplete="current-password"
          />
          <ilex-password-toggle [(visible)]="showPasswords" />
        </div>
        <ilex-field-errors [field]="form.currentPassword" />
      </div>

      <div hlmField>
        <label hlmFieldLabel for="newPassword">{{ 'account.newPassword' | translate }}</label>
        <input
          hlmInput
          id="newPassword"
          dir="ltr"
          [type]="showPasswords() ? 'text' : 'password'"
          [formField]="form.newPassword"
          autocomplete="new-password"
        />
        <p hlmFieldDescription>{{ 'account.newPasswordHelp' | translate: limits }}</p>
        <ilex-field-errors [field]="form.newPassword" />
      </div>

      <div hlmField>
        <label hlmFieldLabel for="confirmNewPassword">{{
          'account.confirmNewPassword' | translate
        }}</label>
        <input
          hlmInput
          id="confirmNewPassword"
          dir="ltr"
          [type]="showPasswords() ? 'text' : 'password'"
          [formField]="form.confirmNewPassword"
          autocomplete="new-password"
        />
        <ilex-field-errors [field]="form.confirmNewPassword" />
      </div>
    </form>
    <hlm-dialog-footer>
      <button hlmBtn type="button" variant="outline" (click)="shown.set(false)">
        {{ 'account.cancel' | translate }}
      </button>
      <button hlmBtn type="submit" form="password-form" [disabled]="profilePageStore.submitting()">
        {{ (profilePageStore.submitting() ? 'account.submitting' : 'account.submit') | translate }}
      </button>
    </hlm-dialog-footer>
  </hlm-dialog-content>
</hlm-dialog>
