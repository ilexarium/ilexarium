<button
  hlmBtn
  type="button"
  variant="ghost"
  size="icon"
  class="absolute top-0 right-0"
  [attr.aria-label]="visible() ? 'Hide passwords' : 'Show passwords'"
  [attr.aria-pressed]="visible()"
  (click)="visible.set(!visible())"
>
  <ng-icon [name]="visible() ? 'lucideEyeOff' : 'lucideEye'" aria-hidden="true" />
</button>
