<div class="flex min-w-0 items-center gap-1 rounded-md bg-muted ps-3" dir="ltr">
  <code class="min-w-0 flex-1 overflow-x-auto py-1.5 font-mono text-sm whitespace-nowrap">{{
    command()
  }}</code>
  <button
    hlmBtn
    variant="ghost"
    size="icon"
    type="button"
    class="shrink-0"
    [attr.aria-label]="(copied() ? 'copyCommand.copied' : 'copyCommand.copy') | translate"
    (click)="copy()"
  >
    <ng-icon [name]="copied() ? 'lucideCheck' : 'lucideCopy'" aria-hidden="true" />
  </button>
</div>
