<hlm-dialog [state]="shown() ? 'open' : 'closed'" (closed)="closed.emit()">
  <hlm-dialog-content
    *hlmDialogPortal
    class="max-h-[90dvh] overflow-y-auto sm:max-w-lg"
    [closeLabel]="'profile.dialog.close' | translate"
  >
    <hlm-dialog-header>
      <h2 hlmDialogTitle>{{ 'profile.dialog.title' | translate }}</h2>
      <p hlmDialogDescription>{{ 'profile.dialog.description' | translate }}</p>
    </hlm-dialog-header>

    <form id="profile-form" [formRoot]="form" class="grid gap-6">
      <ilex-form-errors [form]="form" />

      <section class="grid gap-3" aria-labelledby="profile-picture-heading">
        <h3 id="profile-picture-heading" class="text-sm font-medium">
          {{ 'profile.picture.title' | translate }}
        </h3>
        <ilex-avatar-picker
          [user]="authStore.user()"
          [preview]="picture()"
          [removed]="profileEditStore.picture().kind === 'remove'"
          [problem]="profileEditStore.pictureProblem()"
          [preparing]="profileEditStore.preparing()"
          (choose)="profileEditStore.choosePicture($event)"
          (remove)="profileEditStore.removePicture()"
        />
      </section>

      <div class="grid gap-4 sm:grid-cols-2">
        <div hlmField>
          <label hlmFieldLabel for="displayName">{{ 'profile.displayName' | translate }}</label>
          <input
            hlmInput
            id="displayName"
            dir="auto"
            autocomplete="name"
            [formField]="form.displayName"
          />
          <p hlmFieldDescription>{{ 'profile.displayNameHelp' | translate }}</p>
          <ilex-field-errors [field]="form.displayName" />
        </div>
        <div hlmField>
          <label hlmFieldLabel for="email">{{ 'profile.email' | translate }}</label>
          <input
            hlmInput
            id="email"
            type="email"
            dir="ltr"
            autocomplete="email"
            [formField]="form.email"
          />
          <p hlmFieldDescription>{{ 'profile.emailHelp' | translate }}</p>
          <ilex-field-errors [field]="form.email" />
        </div>
      </div>
    </form>

    <hlm-dialog-footer>
      <button hlmBtn type="button" variant="outline" (click)="shown.set(false)">
        {{ 'profile.dialog.cancel' | translate }}
      </button>
      <button
        hlmBtn
        type="submit"
        form="profile-form"
        [disabled]="form().submitting() || profileEditStore.preparing()"
      >
        {{ (form().submitting() ? 'profile.dialog.saving' : 'profile.dialog.save') | translate }}
      </button>
    </hlm-dialog-footer>
  </hlm-dialog-content>
</hlm-dialog>
