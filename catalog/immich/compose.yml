# Immich, from the Laris template (catalog/immich), based on Immich's own docker-compose.yml. This
# folder is yours: change anything. The server and machine learning share IMMICH_VERSION (they
# must match); the database stays on its major version (upgrading it is Immich's own procedure).
services:
  immich-server:
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION}
    ports:
      - '${WEB_PORT}:2283'
    environment:
      TZ: ${TZ}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_USERNAME: postgres
      DB_DATABASE_NAME: immich
    volumes:
      - ${UPLOAD_DIR}:/data
    depends_on:
      - redis
      - database
    labels: &labels
      laris.template: immich@2
    restart: unless-stopped
    healthcheck:
      disable: false
    logging: &logging
      driver: json-file
      options: { max-size: 10m, max-file: '3' }

  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION}
    environment:
      TZ: ${TZ}
    volumes:
      - ${MODEL_CACHE_DIR}:/cache
    labels: *labels
    restart: unless-stopped
    healthcheck:
      disable: false
    logging: *logging

  redis:
    image: docker.io/valkey/valkey:9
    healthcheck:
      test: redis-cli ping | grep -q PONG || exit 1
    labels: *labels
    restart: unless-stopped
    logging: *logging

  database:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: postgres
      POSTGRES_DB: immich
      POSTGRES_INITDB_ARGS: '--data-checksums'
    volumes:
      - ${DB_DATA_DIR}:/var/lib/postgresql/data
    shm_size: 128mb
    labels: *labels
    restart: unless-stopped
    healthcheck:
      disable: false
    logging: *logging
