# Navidrome — reviewed recipe (docs/plans/service_deploys.md, decision 6).
# Only placeholders for fields declared in meta.json; images pinned by digest.
services:
  navidrome:
    image: deluan/navidrome:0.64.2@sha256:38dc2727bfcfd5ede290f8ada114fc90368146f265ae4701ddddbcbe2a44ee52
    # The owner of the folders the wrapper creates (meta.json dataOwner).
    user: '1000:1000'
    ports:
      - '${WEB_PORT}:4533'
    environment:
      ND_MUSICFOLDER: /music
      ND_DATAFOLDER: /data
    volumes:
      - type: bind
        source: ${MUSIC_DIR}
        target: /music
        read_only: true
      - type: bind
        source: ${DATA_DIR}
        target: /data
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: '3' }
