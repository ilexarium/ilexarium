# Navidrome, from the Ilexarium template (catalog/navidrome). This folder is yours: change anything.
services:
  navidrome:
    image: deluan/navidrome:${NAVIDROME_VERSION}
    # Runs as you, so it can read your music and write its data.
    user: '${USER_ID}'
    ports:
      - '${WEB_PORT}:4533'
    environment:
      ND_MUSICFOLDER: /music
      ND_DATAFOLDER: /data
    volumes:
      - ${MUSIC_DIR}:/music:ro
      - ${DATA_DIR}:/data
    labels:
      ilex.template: navidrome@2
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: '3' }
