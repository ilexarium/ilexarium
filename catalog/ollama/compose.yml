# Ollama, from the Laris template (catalog/ollama): runs language models for the Assistant. This
# folder is yours: change anything.
# Ollama has no sign-in: its port is on 127.0.0.1 (this machine only) by default — only Laris
# talks to it. For a graphics card, see the note in Laris (the lines to add here).
services:
  ollama:
    image: ollama/ollama:${OLLAMA_VERSION}
    user: '${USER_ID}'
    ports:
      - '${API_ADDRESS}:${API_PORT}:11434'
    environment:
      HOME: /data
      OLLAMA_MODELS: /data/models
    volumes:
      - ${DATA_DIR}:/data
    labels:
      laris.template: ollama@2
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: '3' }
