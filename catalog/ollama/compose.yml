# Ollama, from the Ilexarium template (catalog/ollama): runs language models for programs on this
# machine. This folder is yours: change anything. To chat with models, Open WebUI's template brings
# its own Ollama.
# Ollama has no sign-in: its port is on 127.0.0.1 (this machine only) by default. For a graphics
# card, see the note in Ilexarium (the lines to add here).
services:
  ollama:
    image: ollama/ollama:${OLLAMA_VERSION}
    user: '${USER_ID}'
    ports:
      - '${API_ADDRESS}:${API_PORT}:11434'
    environment:
      HOME: /data
      OLLAMA_MODELS: /data/models
    volumes:
      - ${DATA_DIR}:/data
    labels:
      ilex.template: ollama@3
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: '3' }
