# Docker socket proxy — REVIEW-REQUIRED (see system/CLAUDE.md).
#
# The app never talks to /var/run/docker.sock: access to it is root-equivalent (anyone who can
# use it can start a container that mounts the host's disk). It talks to this proxy instead, which
# passes on an exact allow-list of read-only requests and refuses everything else with 403.
#
# Allowed (GET; HEAD for the ping), with or without an API version prefix (/v1.NN):
#   /_ping, /version            — reachability
#   /containers/json            — the list (also shows each container's command line and labels)
#   /containers/{id}/json       — inspect: health, start time. NOTE: includes each container's
#                                 environment, so its secrets. The app keeps only the fields it
#                                 uses and never sends environment values to the browser.
#   /containers/{id}/stats      — live CPU / memory / I/O
#   /containers/{id}/logs       — a container's output (the logs page). NOTE: logs can hold
#                                 secrets (passwords printed at startup); only signed-in users
#                                 see them, always as text.
#   /events                     — what changed
# Refused: every other path (e.g. /containers/{id}/export or /archive — a container's files),
# every other method (all writes), and any connection upgrade (attach/exec hijacking).
#
# Every widening (e.g. restart) is an explicit, reviewed addition here, with its feature.

global
    log stdout format raw local0 info
    maxconn 256

defaults
    mode http
    log global
    option httplog
    timeout connect 5s
    timeout client 1h   # events, stats and logs are long-lived streams
    timeout server 1h
    timeout http-request 10s

frontend docker_api
    bind :2375

    acl read_method   method GET HEAD
    acl head_method   method HEAD
    acl upgrade       hdr_cnt(upgrade) gt 0

    # Container ids and names: Docker's own name rule; no "/", "%" or other characters.
    acl ping          path_reg ^(/v1\.[0-9]+)?/_ping$
    acl version       path_reg ^(/v1\.[0-9]+)?/version$
    acl list          path_reg ^(/v1\.[0-9]+)?/containers/json$
    acl inspect       path_reg ^(/v1\.[0-9]+)?/containers/[a-zA-Z0-9][a-zA-Z0-9_.-]*/json$
    acl stats         path_reg ^(/v1\.[0-9]+)?/containers/[a-zA-Z0-9][a-zA-Z0-9_.-]*/stats$
    acl logs          path_reg ^(/v1\.[0-9]+)?/containers/[a-zA-Z0-9][a-zA-Z0-9_.-]*/logs$
    acl events        path_reg ^(/v1\.[0-9]+)?/events$

    http-request deny deny_status 403 if !read_method or upgrade
    http-request deny deny_status 403 if head_method !ping
    http-request deny deny_status 403 unless ping or version or list or inspect or stats or logs or events

    default_backend docker_socket

backend docker_socket
    server docker /var/run/docker.sock
