# Docker socket proxy — REVIEW-REQUIRED (see system/CLAUDE.md).
#
# The app never talks to /var/run/docker.sock: access to it is root-equivalent (anyone who can
# use it can start a container that mounts the host's disk). It talks to this proxy instead, which
# passes on an exact allow-list of requests — reads, three container actions and freeing Docker's
# unused data — and refuses everything else with 403.
#
# Allowed (GET; HEAD for the ping), with or without an API version prefix (/v1.NN):
#   /_ping, /version            — reachability
#   /containers/json            — the list (also shows each container's command line and labels)
#   /containers/{id}/json       — inspect: health, start time. NOTE: includes each container's
#                                 environment, so its secrets. The app keeps only the fields it
#                                 uses and never sends environment values to the browser.
#   /containers/{id}/stats      — live CPU / memory / I/O
#   /containers/{id}/logs       — a container's output (the logs page). NOTE: logs can hold
#                                 secrets (passwords printed at startup); only signed-in users
#                                 see them, always as text.
#   /events                     — what changed
#   /system/df                  — disk usage: images, build cache, volume sizes (the Free space card)
#   /volumes                    — the volume list (only the list, not one volume's details)
#
# Allowed writes (POST; container actions — the ⋯ menu):
#   /containers/{id}/start, /stop, /restart
#     Only exactly these, and only without a request body (old API versions let `start` carry
#     host settings — mounts, privileges) and without a query string (no `signal`, no `t`: stop
#     and restart use the container's default grace period). The version prefix, if any, must be
#     at least v1.40 (the daemon's own minimum, Docker 29) — no old API's semantics.
#     NOTE: the app refuses to stop or restart containers labelled laris.protected=true; the
#     proxy can't read labels, so that protection is the app's, not this file's.
#
# Allowed deletes (freeing space — the Free space card, each one confirmed by the person):
#   POST /images/prune?filters={"dangling":["false"]}  (exactly this query, URL-encoded as the app
#     sends it) — every image no container uses; an image a stopped container uses stays.
#   POST /build/prune?all=true  (exactly this query) — the whole build cache.
#   DELETE /volumes/{name}  (no query: never `force`) — one volume; Docker itself refuses (409)
#     one a container uses. NOTE: the app refuses the platform's own volumes; the proxy can't
#     tell them apart.
#   The same body and version rules as the container actions.
# Refused: every other path (e.g. /containers/{id}/export or /archive — a container's files),
# every other write (create, exec, kill, update, pause, remove, container, network and volume
# prune, …), every other method, and any
# connection upgrade (attach/exec hijacking).
#
# Every widening is an explicit, reviewed addition here, with its feature.

global
    log stdout format raw local0 info
    maxconn 256

defaults
    mode http
    log global
    option httplog
    timeout connect 5s
    timeout client 1h   # events, stats and logs are long-lived streams
    timeout server 1h
    timeout http-request 10s

frontend docker_api
    # Production (the installer sets LARIS_PROXY_SOCKET): a Unix socket, in a folder only the
    # proxy's user and the app's group can enter (/run/laris/proxy, 0750) — never a TCP port,
    # which every program on the machine could reach. The socket itself is 0666: the folder is
    # the gate. Development: TCP, published on 127.0.0.1 only.
.if defined(LARIS_PROXY_SOCKET)
    bind "unix@${LARIS_PROXY_SOCKET}" mode 666
.else
    bind :2375
.endif

    acl read_method   method GET HEAD
    acl head_method   method HEAD
    acl write_method  method POST
    acl delete_method method DELETE
    acl upgrade       hdr_cnt(upgrade) gt 0
    # A body: chunked, or any non-zero length. (HAProxy itself rejects conflicting lengths.)
    acl has_body      req.hdr_cnt(transfer-encoding) gt 0
    acl has_body      req.hdr_val(content-length) gt 0
    acl has_query     url_sub ?

    # Container ids and names: Docker's own name rule; no "/", "%" or other characters.
    acl ping          path_reg ^(/v1\.[0-9]+)?/_ping$
    acl version       path_reg ^(/v1\.[0-9]+)?/version$
    acl list          path_reg ^(/v1\.[0-9]+)?/containers/json$
    acl inspect       path_reg ^(/v1\.[0-9]+)?/containers/[a-zA-Z0-9][a-zA-Z0-9_.-]*/json$
    acl stats         path_reg ^(/v1\.[0-9]+)?/containers/[a-zA-Z0-9][a-zA-Z0-9_.-]*/stats$
    acl logs          path_reg ^(/v1\.[0-9]+)?/containers/[a-zA-Z0-9][a-zA-Z0-9_.-]*/logs$
    acl events        path_reg ^(/v1\.[0-9]+)?/events$
    acl disk_usage    path_reg ^(/v1\.[0-9]+)?/system/df$
    acl volume_list   path_reg ^(/v1\.[0-9]+)?/volumes$
    # Writes: v1.40 or later only (40–99, or three digits and up).
    acl action        path_reg ^(/v1\.([4-9][0-9]|[1-9][0-9]{2,}))?/containers/[a-zA-Z0-9][a-zA-Z0-9_.-]*/(start|stop|restart)$
    acl image_prune   path_reg ^(/v1\.([4-9][0-9]|[1-9][0-9]{2,}))?/images/prune$
    acl build_prune   path_reg ^(/v1\.([4-9][0-9]|[1-9][0-9]{2,}))?/build/prune$
    acl volume_remove path_reg ^(/v1\.([4-9][0-9]|[1-9][0-9]{2,}))?/volumes/[a-zA-Z0-9][a-zA-Z0-9_.-]+$
    # The one query each prune may carry, byte for byte.
    acl image_prune_query query -m str filters=%7B%22dangling%22%3A%5B%22false%22%5D%7D
    acl build_prune_query query -m str all=true

    http-request deny deny_status 403 if upgrade
    http-request deny deny_status 403 unless read_method or write_method or delete_method
    http-request deny deny_status 403 if head_method !ping
    http-request deny deny_status 403 if write_method has_body or delete_method has_body
    http-request deny deny_status 403 if write_method !action !image_prune !build_prune
    http-request deny deny_status 403 if write_method action has_query
    http-request deny deny_status 403 if write_method image_prune !image_prune_query
    http-request deny deny_status 403 if write_method build_prune !build_prune_query
    http-request deny deny_status 403 if delete_method !volume_remove or delete_method has_query
    http-request deny deny_status 403 if read_method !ping !version !list !inspect !stats !logs !events !disk_usage !volume_list

    default_backend docker_socket

backend docker_socket
    server docker /var/run/docker.sock
