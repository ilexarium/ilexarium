# /opt/ilex/platform/compose.yml
# The platform's own containers, beside the app (which runs on the host as ilex.service):
# its database and the Docker socket proxy. Started by ilex-platform.service:
#   docker compose --project-directory /opt/ilex/platform --env-file /etc/ilex/platform.env up -d --wait
# Both are labelled protected: the app refuses to stop or restart them. Design: docs/plans/installer.md.
name: ilex

services:
  postgres:
    # Official image, pinned by digest (18-alpine; a multi-architecture index: amd64, arm64, …).
    image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    # POSTGRES_USER (the owner role: migrations and backups), POSTGRES_PASSWORD, POSTGRES_DB —
    # root-only (0600). The app connects as its own role, which may only read and write data.
    env_file: /etc/ilex/database.env
    # This machine only: services' containers can't reach the host's loopback.
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql
    labels:
      ilex.protected: 'true'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # The Docker API allow-list the app talks to — system/docker-socket-proxy/haproxy.cfg. No
  # network at all: it answers only on a Unix socket in /run/ilex/proxy, a folder only its own
  # user (99) and the app's group can enter (systemd-tmpfiles: /etc/tmpfiles.d/ilex.conf).
  docker-proxy:
    # Official image, pinned by digest (3.4-alpine, HAProxy 3.4.6). Runs as user haproxy (uid 99).
    image: haproxy:3.4-alpine@sha256:7af8255207ee9964ccb4eec8ce4b7a40b777769665e3ae83897fb01b24d8a43a
    group_add:
      # The host's docker group, inside this container only: lets the proxy open the socket.
      - '${DOCKER_GID:?set in /etc/ilex/platform.env}'
    environment:
      ILEX_PROXY_SOCKET: /run/ilex-proxy/docker.sock
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      # :ro does not make the socket read-only (connecting is not a write) — the allow-list does.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /run/ilex/proxy:/run/ilex-proxy
    network_mode: none
    labels:
      ilex.protected: 'true'
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    restart: unless-stopped

volumes:
  pgdata:
