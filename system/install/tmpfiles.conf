# /etc/tmpfiles.d/ilex.conf — REVIEW-REQUIRED (system/CLAUDE.md).
# /run is emptied at every boot: these folders are made again before the platform starts.
# The Docker socket proxy's socket lives in /run/ilex/proxy — only the proxy's user (99, in
# its container) and the app's group may enter it. That folder is what keeps every other
# program on this machine away from the Docker API.
d /run/ilex        0755 root root    -
d /run/ilex/proxy  0750 99   ilex -
