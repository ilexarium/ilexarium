# /etc/ssh/sshd_config.d/laris.conf — REVIEW-REQUIRED (system/CLAUDE.md).
# The platform's Linux sign-in (the file explorer and the web terminal) connects to this
# machine's own SSH server as a person's Linux account, with that person's password
# (docs/plans/files_and_terminal.md). Password logins are allowed here for connections from this
# machine itself only — every other connection keeps the main configuration's settings.
Match Address 127.0.0.1,::1
    PasswordAuthentication yes
# Ends the Match block, so nothing read after this file belongs to it.
Match all
