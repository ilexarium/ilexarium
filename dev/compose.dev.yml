# Local development only. Production Postgres is provisioned by the install script.
# Start with `npm run db:up` (it passes DOCKER_GID, the group of the Docker socket on this machine).
# Creates `homelab` (dev) and `homelab_test` (tests); init scripts run only on a fresh volume.
name: homelab-dev

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: homelab
      POSTGRES_PASSWORD: homelab-dev
      POSTGRES_DB: homelab
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    labels:
      # The app refuses to stop or restart it (its own database).
      homelab.protected: 'true'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U homelab -d homelab']
      interval: 5s
      timeout: 3s
      retries: 10

  # The Docker API allow-list the app talks to (DOCKER_HOST=tcp://127.0.0.1:2375).
  # REVIEW-REQUIRED: system/docker-socket-proxy/haproxy.cfg. In production it has no network at
  # all and answers on a Unix socket only the app's group can reach (system/platform/compose.yml).
  docker-proxy:
    # Official image, pinned by digest (3.4-alpine, HAProxy 3.4.6). Runs as user haproxy (uid 99).
    image: haproxy:3.4-alpine@sha256:7af8255207ee9964ccb4eec8ce4b7a40b777769665e3ae83897fb01b24d8a43a
    group_add:
      # The host's docker group, inside this container only: lets the proxy open the socket.
      - '${DOCKER_GID:?run via npm run db:up, which sets DOCKER_GID}'
    volumes:
      - ../system/docker-socket-proxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      # :ro does not make the socket read-only (connecting is not a write) — the allow-list does.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - '127.0.0.1:2375:2375'
    labels:
      homelab.protected: 'true'
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    restart: unless-stopped

  # An SSH server standing in for the machine's own (dev/sshd/): the Linux sign-in and the file
  # explorer sign in to it (anna / anna-dev-password). Its host key is shared with the app in
  # apps/server/.dev/sshd, which pins it.
  sshd:
    build: ./sshd
    ports:
      - '127.0.0.1:2222:22'
    volumes:
      - ../apps/server/.dev/sshd:/keys
    restart: unless-stopped

  # Something to start, stop and restart: the container actions' e2e tests and trying the menu.
  # Not protected. Does nothing; stops at once (SIGTERM ends the sleep).
  sandbox:
    image: busybox:1.37
    command: ['sh', '-c', 'trap "exit 0" TERM; echo sandbox up; while true; do sleep 1; done']
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    network_mode: none
    restart: 'no'

volumes:
  pgdata:
