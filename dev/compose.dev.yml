# Local development only. Production Postgres is provisioned by the install script.
name: homelab-dev

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: homelab
      POSTGRES_PASSWORD: homelab-dev
      POSTGRES_DB: homelab
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U homelab -d homelab']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
