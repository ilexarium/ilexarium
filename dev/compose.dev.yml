# Local development only. Production Postgres is provisioned by the install script.
# Start with `npm run db:up` (through dev/compose.sh, which passes DOCKER_GID and the rest).
# Creates `laris` (dev) and `laris_test` (tests); init scripts run only on a fresh volume.
name: laris-dev

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: laris
      POSTGRES_PASSWORD: laris-dev
      POSTGRES_DB: laris
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    labels:
      # The app refuses to stop or restart it (its own database).
      laris.protected: 'true'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U laris -d laris']
      interval: 5s
      timeout: 3s
      retries: 10

  # The Docker API allow-list the app talks to (DOCKER_HOST=tcp://127.0.0.1:2375).
  # REVIEW-REQUIRED: system/docker-socket-proxy/haproxy.cfg. In production it has no network at
  # all and answers on a Unix socket only the app's group can reach (system/platform/compose.yml).
  docker-proxy:
    # Official image, pinned by digest (3.4-alpine, HAProxy 3.4.6). Runs as user haproxy (uid 99).
    image: haproxy:3.4-alpine@sha256:7af8255207ee9964ccb4eec8ce4b7a40b777769665e3ae83897fb01b24d8a43a
    group_add:
      # The host's docker group, inside this container only: lets the proxy open the socket.
      - '${DOCKER_GID:?run through dev/compose.sh (npm run db:up), which sets DOCKER_GID}'
    volumes:
      - ../system/docker-socket-proxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      # :ro does not make the socket read-only (connecting is not a write) — the allow-list does.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - '127.0.0.1:2375:2375'
    labels:
      laris.protected: 'true'
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    restart: unless-stopped

  # An SSH server standing in for the machine's own (dev/sshd/): the Linux sign-in and the file
  # explorer sign in to it (anna / anna-dev-password). Its host key is shared with the app in
  # apps/server/.dev/sshd, which pins it.
  # The host's PIDs, so ending a process over it ends the one the process list (the host's /proc)
  # shows. Development only: anna's laris-root is root in here, and may signal this machine's
  # processes — as the real sudo would on the real machine.
  sshd:
    build: ./sshd
    pid: host
    ports:
      - '127.0.0.1:2222:22'
    volumes:
      - ../apps/server/.dev/sshd:/keys
      - ../system/programs:/opt/laris/libexec:ro
    restart: unless-stopped

  # Something to start, stop and restart: the container actions' e2e tests and trying the menu.
  # Not protected. Does nothing; stops at once (SIGTERM ends the sleep).
  sandbox:
    image: busybox:1.37
    command: ['sh', '-c', 'trap "exit 0" TERM; echo sandbox up; while true; do sleep 1; done']
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    network_mode: none
    restart: 'no'

  # The server and its tests on Linux, for working from a Mac (dev/server/): `npm run server:up`,
  # then `npm run srv -- <command>`. The host's network and PIDs (on a Mac, Docker's VM): it
  # reaches the services above on 127.0.0.1 like a server run directly, and the process list
  # matches what sshd ends.
  server:
    profiles: [server]
    build: ./server
    network_mode: host
    pid: host
    environment:
      LARIS_REPO: ${LARIS_REPO:?run through dev/compose.sh}
      HOST_UID: ${HOST_UID:?run through dev/compose.sh}
      HOST_GID: ${HOST_GID:?run through dev/compose.sh}
      DOCKER_GID: ${DOCKER_GID:?run through dev/compose.sh}
    working_dir: ${LARIS_REPO}
    volumes:
      - ..:${LARIS_REPO}
      # The backup program (run directly in development) dumps the database with docker exec.
      - /var/run/docker.sock:/var/run/docker.sock
      - server-modules:${LARIS_REPO}/node_modules
      - server-modules-server:${LARIS_REPO}/apps/server/node_modules
      - server-modules-web:${LARIS_REPO}/apps/web/node_modules
      - server-modules-shared:${LARIS_REPO}/packages/shared/node_modules
      - server-modules-i18n:${LARIS_REPO}/packages/i18n/node_modules
      - server-home:/home/dev
    restart: unless-stopped

volumes:
  pgdata:
  server-modules:
  server-modules-server:
  server-modules-web:
  server-modules-shared:
  server-modules-i18n:
  server-home:
